<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#0F172A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="860" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="860"/>
    <line x1="400" y1="0" x2="400" y2="860"/>
    <line x1="600" y1="0" x2="600" y2="860"/>
    <line x1="800" y1="0" x2="800" y2="860"/>
    <line x1="1000" y1="0" x2="1000" y2="860"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="65" y="16" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CAMPUS SYSTEM</text>
    <text x="0" y="55" fill="#F8FAFC" font-size="28" font-weight="800" letter-spacing="-0.5">Campus Lost &amp; Found System</text>
    <text x="0" y="80" fill="#94A3B8" font-size="14">End-to-End Operational Lifecycle &amp; Verification Workflow</text>
  </g>

  <!-- Legend / Pillars -->
  <g transform="translate(760, 50)">
    <circle cx="10" cy="12" r="5" fill="#38BDF8"/>
    <text x="24" y="16" fill="#E2E8F0" font-size="12" font-weight="600">Student Flow</text>
    <circle cx="130" cy="12" r="5" fill="#34D399"/>
    <text x="144" y="16" fill="#E2E8F0" font-size="12" font-weight="600">Security Flow</text>
    <circle cx="260" cy="12" r="5" fill="#C084FC"/>
    <text x="274" y="16" fill="#E2E8F0" font-size="12" font-weight="600">AI Engine</text>
    <circle cx="360" cy="12" r="5" fill="#FBBF24"/>
    <text x="374" y="16" fill="#E2E8F0" font-size="12" font-weight="600">Verification</text>
  </g>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g transform="translate(60, 160)">
    <rect width="250" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="20" width="75" height="22" rx="11" fill="url(#accentBlue)"/>
    <text x="57" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">STAGE 1</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="17" font-weight="700">Ingestion &amp; Intake</text>
    <text x="20" y="85" fill="#94A3B8" font-size="12">Campus report registration</text>

    <!-- Box 1A: Lost Item -->
    <rect x="18" y="110" width="214" height="150" rx="12" fill="#0F172A" stroke="#2563EB" stroke-width="1.5"/>
    <text x="32" y="135" fill="#60A5FA" font-size="13" font-weight="700">🔍 Lost Item Report</text>
    <text x="32" y="158" fill="#E2E8F0" font-size="12" font-weight="600">Reported by Student</text>
    <text x="32" y="180" fill="#94A3B8" font-size="11">• Item category &amp; title</text>
    <text x="32" y="200" fill="#94A3B8" font-size="11">• Approx. location &amp; date</text>
    <text x="32" y="220" fill="#94A3B8" font-size="11">• Secret identifying marks</text>
    <rect x="32" y="235" width="85" height="16" rx="4" fill="#1E3A8A"/>
    <text x="74" y="247" fill="#93C5FD" font-size="10" font-weight="600" text-anchor="middle">STATUS: ACTIVE</text>

    <!-- Box 1B: Found Item -->
    <rect x="18" y="280" width="214" height="180" rx="12" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
    <text x="32" y="305" fill="#34D399" font-size="13" font-weight="700">📦 Found Item Log</text>
    <text x="32" y="328" fill="#E2E8F0" font-size="12" font-weight="600">Reported by Finder / Staff</text>
    <text x="32" y="350" fill="#94A3B8" font-size="11">• Item photos uploaded</text>
    <text x="32" y="370" fill="#94A3B8" font-size="11">• Location found</text>
    <text x="32" y="390" fill="#94A3B8" font-size="11">• Physical item surrendered</text>
    <text x="32" y="410" fill="#34D399" font-size="11" font-weight="600">→ Custody: Block 29</text>
    <rect x="32" y="425" width="85" height="16" rx="4" fill="#064E3B"/>
    <text x="74" y="437" fill="#6EE7B7" font-size="10" font-weight="600" text-anchor="middle">STATUS: ACTIVE</text>
  </g>

  <!-- Connectors Stage 1 -> Stage 2 -->
  <path d="M 292 345 L 340 345" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 292 530 L 315 530 L 315 420 L 340 420" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- ==================== STAGE 2: AUTO-MATCHING ==================== -->
  <g transform="translate(350, 160)">
    <rect width="240" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="20" width="75" height="22" rx="11" fill="url(#accentPurple)"/>
    <text x="57" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">STAGE 2</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="17" font-weight="700">AI Matching Engine</text>
    <text x="20" y="85" fill="#94A3B8" font-size="12">Automated correlation</text>

    <!-- Scoring Logic Box -->
    <rect x="18" y="110" width="204" height="175" rx="12" fill="#0F172A" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="30" y="135" fill="#C084FC" font-size="13" font-weight="700">⚙️ Correlation Algorithm</text>
    <text x="30" y="160" fill="#E2E8F0" font-size="11">• Category match (40%)</text>
    <text x="30" y="180" fill="#E2E8F0" font-size="11">• Campus zone match (25%)</text>
    <text x="30" y="200" fill="#E2E8F0" font-size="11">• Date proximity (±3d) (20%)</text>
    <text x="30" y="220" fill="#E2E8F0" font-size="11">• Text similarity NLP (15%)</text>
    
    <rect x="30" y="240" width="180" height="30" rx="6" fill="#3B0764"/>
    <text x="120" y="260" fill="#E9D5FF" font-size="11" font-weight="700" text-anchor="middle">Threshold: ≥ 75% Score</text>

    <!-- Decision Outcome Boxes -->
    <!-- High Match -->
    <rect x="18" y="305" width="204" height="65" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="30" y="327" fill="#38BDF8" font-size="12" font-weight="700">High Match Alert (≥75%)</text>
    <text x="30" y="347" fill="#94A3B8" font-size="11">Direct Email &amp; In-App Alert</text>
    <rect x="135" y="318" width="75" height="16" rx="4" fill="#0C4A6E"/>
    <text x="172" y="330" fill="#7DD3FC" font-size="9" font-weight="600" text-anchor="middle">MATCHED</text>

    <!-- Low Match / Catalog -->
    <rect x="18" y="385" width="204" height="65" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.2"/>
    <text x="30" y="407" fill="#E2E8F0" font-size="12" font-weight="700">Public Found Catalog</text>
    <text x="30" y="427" fill="#94A3B8" font-size="11">Searchable by Category &amp; Area</text>
    <rect x="135" y="398" width="75" height="16" rx="4" fill="#334155"/>
    <text x="172" y="410" fill="#CBD5E1" font-size="9" font-weight="600" text-anchor="middle">CATALOG</text>
  </g>

  <!-- Connectors Stage 2 -> Stage 3 -->
  <path d="M 572 495 L 620 495" stroke="#C084FC" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  <path d="M 572 580 L 600 580 L 600 540 L 620 540" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- ==================== STAGE 3: CLAIM & PROOF ==================== -->
  <g transform="translate(630, 160)">
    <rect width="240" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="20" width="75" height="22" rx="11" fill="url(#accentAmber)"/>
    <text x="57" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">STAGE 3</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="17" font-weight="700">Claim &amp; Proof</text>
    <text x="20" y="85" fill="#94A3B8" font-size="12">Ownership validation</text>

    <!-- Student Claim Box -->
    <rect x="18" y="110" width="204" height="150" rx="12" fill="#0F172A" stroke="#D97706" stroke-width="1.5"/>
    <text x="30" y="135" fill="#FBBF24" font-size="13" font-weight="700">📝 Claim Submission</text>
    <text x="30" y="158" fill="#E2E8F0" font-size="12" font-weight="600">Student Provides Evidence:</text>
    <text x="30" y="180" fill="#94A3B8" font-size="11">• Purchase invoice / receipt</text>
    <text x="30" y="200" fill="#94A3B8" font-size="11">• Serial # / IMEI / Unlock</text>
    <text x="30" y="220" fill="#94A3B8" font-size="11">• Distinct mark / contents</text>
    <rect x="30" y="232" width="100" height="16" rx="4" fill="#78350F"/>
    <text x="80" y="244" fill="#FDE68A" font-size="9" font-weight="600" text-anchor="middle">CLAIM_PENDING</text>

    <!-- Officer Review Box -->
    <rect x="18" y="280" width="204" height="180" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
    <text x="30" y="305" fill="#38BDF8" font-size="13" font-weight="700">👮 Officer Verification</text>
    <text x="30" y="328" fill="#E2E8F0" font-size="11">Security Desk reviews evidence</text>
    
    <!-- Approve/Reject badges -->
    <rect x="30" y="345" width="80" height="24" rx="6" fill="#064E3B" stroke="#059669"/>
    <text x="70" y="361" fill="#6EE7B7" font-size="11" font-weight="700" text-anchor="middle">✓ APPROVE</text>

    <rect x="120" y="345" width="80" height="24" rx="6" fill="#7F1D1D" stroke="#DC2626"/>
    <text x="160" y="361" fill="#FCA5A5" font-size="11" font-weight="700" text-anchor="middle">✗ REJECT</text>

    <text x="30" y="395" fill="#94A3B8" font-size="11">If Approved: System issues</text>
    <text x="30" y="413" fill="#38BDF8" font-size="11" font-weight="700">Dynamic 6-Digit OTP &amp; QR</text>
    <rect x="30" y="425" width="75" height="16" rx="4" fill="#0C4A6E"/>
    <text x="67" y="437" fill="#7DD3FC" font-size="9" font-weight="600" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Connectors Stage 3 -> Stage 4 -->
  <path d="M 852 510 L 900 510" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- ==================== STAGE 4: HANDOVER ==================== -->
  <g transform="translate(910, 160)">
    <rect width="230" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Stage Pill -->
    <rect x="20" y="20" width="75" height="22" rx="11" fill="url(#accentGreen)"/>
    <text x="57" y="35" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">STAGE 4</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="17" font-weight="700">Secure Handover</text>
    <text x="20" y="85" fill="#94A3B8" font-size="12">Custody closure</text>

    <!-- Desk Verification -->
    <rect x="18" y="110" width="194" height="150" rx="12" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
    <text x="30" y="135" fill="#34D399" font-size="13" font-weight="700">🏢 Physical Handover</text>
    <text x="30" y="158" fill="#E2E8F0" font-size="11">At Security Desk (Block 29):</text>
    <text x="30" y="180" fill="#94A3B8" font-size="11">1. Student presents ID</text>
    <text x="30" y="200" fill="#94A3B8" font-size="11">2. Officer scans QR / OTP</text>
    <text x="30" y="220" fill="#94A3B8" font-size="11">3. Token validation passes</text>
    <rect x="30" y="235" width="85" height="16" rx="4" fill="#064E3B"/>
    <text x="72" y="247" fill="#6EE7B7" font-size="9" font-weight="600" text-anchor="middle">RETURNED</text>

    <!-- Audit & Archive -->
    <rect x="18" y="280" width="194" height="180" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="305" fill="#F8FAFC" font-size="13" font-weight="700">📋 Custody Audit Trail</text>
    <text x="30" y="330" fill="#94A3B8" font-size="11">• Officer badge recorded</text>
    <text x="30" y="350" fill="#94A3B8" font-size="11">• Claimant ID logged</text>
    <text x="30" y="370" fill="#94A3B8" font-size="11">• Handover timestamp</text>
    <text x="30" y="390" fill="#94A3B8" font-size="11">• Digital signature signed</text>
    
    <rect x="30" y="415" width="170" height="30" rx="8" fill="#059669"/>
    <text x="115" y="435" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">✔ CASE CLOSED</text>
  </g>

  <!-- ==================== BOTTOM STATUS TIMELINE ==================== -->
  <g transform="translate(60, 680)">
    <rect width="1080" height="135" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="30" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1">ITEM STATUS STATE MACHINE</text>

    <!-- State Bubbles -->
    <g transform="translate(30, 48)">
      <!-- 1 -->
      <rect x="0" y="10" width="130" height="45" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="65" y="32" fill="#60A5FA" font-size="12" font-weight="700" text-anchor="middle">1. ACTIVE</text>
      <text x="65" y="47" fill="#94A3B8" font-size="10" text-anchor="middle">Report Registered</text>
      <path d="M 135 32 L 175 32" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 2 -->
      <rect x="185" y="10" width="140" height="45" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
      <text x="255" y="32" fill="#C084FC" font-size="12" font-weight="700" text-anchor="middle">2. MATCHED</text>
      <text x="255" y="47" fill="#94A3B8" font-size="10" text-anchor="middle">Score ≥ 75% Alerted</text>
      <path d="M 330 32 L 370 32" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 3 -->
      <rect x="380" y="10" width="160" height="45" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="460" y="32" fill="#FBBF24" font-size="12" font-weight="700" text-anchor="middle">3. CLAIM_PENDING</text>
      <text x="460" y="47" fill="#94A3B8" font-size="10" text-anchor="middle">Proof Under Review</text>
      <path d="M 545 32 L 585 32" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 4 -->
      <rect x="595" y="10" width="140" height="45" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="665" y="32" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">4. VERIFIED</text>
      <text x="665" y="47" fill="#94A3B8" font-size="10" text-anchor="middle">OTP / QR Issued</text>
      <path d="M 740 32 L 780 32" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 5 -->
      <rect x="790" y="10" width="140" height="45" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <text x="860" y="32" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">5. RETURNED</text>
      <text x="860" y="47" fill="#94A3B8" font-size="10" text-anchor="middle">Handover Verified</text>
      <path d="M 935 32 L 965 32" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 6 -->
      <rect x="975" y="10" width="100" height="45" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1.5"/>
      <text x="1025" y="32" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">CLOSED</text>
      <text x="1025" y="47" fill="#A7F3D0" font-size="10" text-anchor="middle">Archived</text>
    </g>
  </g>
</svg>
