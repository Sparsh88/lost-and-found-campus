<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Campus Documents and Certificates">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3ece1" />
      <stop offset="100%" stop-color="#e4d6c3" />
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#deskGrad)" />
  <ellipse cx="400" cy="500" rx="270" ry="38" fill="#cbbba5" opacity="0.45" />

  <!-- Back Plastic Clear Sleeve -->
  <g transform="translate(175 110) rotate(-3)" filter="url(#softShadow)">
    <rect x="0" y="0" width="380" height="390" rx="18" fill="#dbeafe" stroke="#93c5fd" stroke-width="3" />
    <rect x="24" y="24" width="332" height="342" rx="10" fill="#ffffff" />
    <rect x="52" y="58" width="140" height="14" rx="4" fill="#1e3a8a" opacity="0.85" />
    <rect x="52" y="88" width="240" height="8" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="52" y="108" width="210" height="8" rx="4" fill="#94a3b8" opacity="0.45" />
  </g>

  <!-- Main Certificate / Academic Transcript -->
  <g transform="translate(225 95) rotate(2)" filter="url(#softShadow)">
    <rect x="0" y="0" width="390" height="385" rx="14" fill="#fffdf8" stroke="#e2e8f0" stroke-width="2" />
    <rect x="18" y="18" width="354" height="349" rx="8" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.7" />
    <!-- University Seal -->
    <circle cx="84" cy="78" r="28" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" />
    <circle cx="84" cy="78" r="18" fill="#1d4ed8" opacity="0.16" />
    <path d="M74 78l7 7 13-14" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Document Header Lines -->
    <rect x="132" y="56" width="180" height="16" rx="4" fill="#0f172a" opacity="0.85" />
    <rect x="132" y="82" width="128" height="10" rx="3" fill="#64748b" opacity="0.55" />
    <!-- Body Rows -->
    <rect x="44" y="138" width="300" height="10" rx="4" fill="#cbd5e1" />
    <rect x="44" y="164" width="270" height="10" rx="4" fill="#cbd5e1" opacity="0.8" />
    <rect x="44" y="190" width="286" height="10" rx="4" fill="#cbd5e1" opacity="0.8" />
    <rect x="44" y="216" width="220" height="10" rx="4" fill="#cbd5e1" opacity="0.7" />
    <!-- Gold Stamp & Signature -->
    <circle cx="292" cy="296" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
    <circle cx="292" cy="296" r="21" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M54 306c24-18 42 8 68-8 16-10 26 2 44-4" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <rect x="44" y="322" width="136" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Blue Front Folder Cover Tab -->
  <g transform="translate(155 280)" filter="url(#softShadow)">
    <path d="M18 0h150c12 0 18 16 32 16h272c12 0 22 10 22 22v156c0 14-11 25-25 25H25c-14 0-25-11-25-25V18C0 8 8 0 18 0z" fill="url(#folderGrad)" opacity="0.93" />
    <rect x="28" y="48" width="152" height="14" rx="7" fill="#ffffff" opacity="0.88" />
    <rect x="28" y="76" width="96" height="9" rx="4.5" fill="#bfdbfe" opacity="0.85" />
    <rect x="414" y="42" width="46" height="26" rx="6" fill="#eff6ff" opacity="0.9" />
  </g>

  <!-- Metallic Ballpoint Pen -->
  <g transform="translate(556 175) rotate(24)" filter="url(#softShadow)">
    <rect x="0" y="0" width="22" height="230" rx="11" fill="#1e293b" />
    <rect x="3" y="18" width="16" height="62" rx="4" fill="#94a3b8" />
    <path d="M3 226l8 30 8-30z" fill="#cbd5e1" />
    <circle cx="11" cy="256" r="2.5" fill="#0f172a" />
  </g>
</svg>
